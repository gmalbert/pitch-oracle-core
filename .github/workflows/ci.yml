name: Core package CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -r requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q pitch_oracle_core models

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel installation and public imports
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import pitch_oracle_core; from pitch_oracle_core import FeatureContract, run_app; print(pitch_oracle_core.__version__)"
