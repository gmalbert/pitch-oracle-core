name: Shared consumer artifact pipeline

on:
  workflow_call:
    inputs:
      core_ref:
        description: "Pinned pitch-oracle-core tag or commit"
        required: true
        type: string
      league_key:
        description: "League key registered by pitch-oracle-core"
        required: true
        type: string
      odds_api_io_bookmakers:
        description: "Comma-separated Odds-API.io bookmakers"
        required: false
        default: "Bet365,Unibet"
        type: string
      install_command:
        description: "Consumer dependency installation command"
        required: false
        default: "python -m pip install -r requirements-ci.txt"
        type: string
      data_command:
        description: "League-specific data preparation command"
        required: true
        type: string
      training_command:
        description: "League-specific model training command"
        required: true
        type: string
      prediction_command:
        description: "League-specific upcoming prediction cache command"
        required: true
        type: string
    secrets:
      PITCH_API_KEY:
        description: "Optional PitchAPI credential for observed analytics and lineup captures"
        required: false
      FD_API_KEY:
        description: "football-data.org X-Auth-Token"
        required: false
      BZZOIRO_KEY:
        required: false
      SPORTS_API_KEY:
        required: false
      THERUNDOWN_API_KEY:
        required: false
      ODDS_API_IO_KEY:
        description: "Odds-API.io server-side credential"
        required: false

permissions:
  contents: write

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PITCH_ORACLE_LEAGUE: ${{ inputs.league_key }}
      PITCH_API_KEY: ${{ secrets.PITCH_API_KEY }}
      PITCH_ORACLE_DISABLE_WEATHER: "1"
      FD_API_KEY: ${{ secrets.FD_API_KEY }}
      BZZOIRO_KEY: ${{ secrets.BZZOIRO_KEY }}
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      ODDS_API_IO_BOOKMAKERS: ${{ inputs.odds_api_io_bookmakers }}
    steps:
      - name: Checkout league consumer
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install consumer and pinned core dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          ${{ inputs.install_command }}
          python -m pip install "pitch-oracle-core[pipeline,diagnostics] @ git+https://github.com/gmalbert/pitch-oracle-core.git@${{ inputs.core_ref }}"
          python -m pip check

      - name: Prepare league data
        shell: bash
        run: ${{ inputs.data_command }}

      - name: Refresh optional PitchAPI data and shared historical features
        run: python -m pitch_oracle_core.pitchapi.pipeline daily --league "${{ inputs.league_key }}"

      - name: Audit chronology and no-odds model candidate
        run: >-
          python -m pitch_oracle_core.audit_cli
          data_files/combined_historical_data_with_calculations_new.csv
          --output-dir precomputed/model-audit

      - name: Train league models
        shell: bash
        run: ${{ inputs.training_command }}

      - name: Precompute model features
        run: python -m precompute_database

      - name: Precompute model diagnostics
        run: python -m precompute_model_diagnostics

      - name: Precompute upcoming predictions
        shell: bash
        run: ${{ inputs.prediction_command }}

      - name: Capture actual forecast issue and publish analytics index
        run: python -m pitch_oracle_core.pitchapi.pipeline hourly --league "${{ inputs.league_key }}"

      - name: Export best bets
        run: python -m pitch_oracle_core.best_bets

      - name: Build and validate cache manifest
        run: python -m build_cache_manifest

      - name: Run consumer tests
        run: python -m pytest -q

      - name: Commit generated runtime cache
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_files models precomputed
          git add -f models/pitchapi_baseline.pkl
          if [ -f models/pitchapi_promoted.pkl ]; then git add -f models/pitchapi_promoted.pkl; fi
          git diff --cached --quiet || git commit -m "chore: refresh precomputed prediction cache" -m $'## Generated artifacts\nRefresh the league data, fitted models, prediction cache, optional PitchAPI revisions and capability audit as one validated set.\n\n## Validation\nChronology/model gates, manifest integrity, and consumer tests passed before committing.'
          git push
